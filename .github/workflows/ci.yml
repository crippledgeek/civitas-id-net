name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Restore NuGet packages into the workspace so actions/cache can persist them between runs.
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json   # pin the exact SDK from global.json (10.0.300, latestFeature)

      # NuGet restore cache. CPM here uses floating 10.0.* ranges, so packages.lock.json
      # (and setup-dotnet's built-in cache, which requires it) is not usable; this manual
      # cache keys on the version inputs and falls back via restore-keys on a partial change.
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore CivitasId.slnx
      - run: dotnet format CivitasId.slnx --verify-no-changes --no-restore
      - run: dotnet build CivitasId.slnx -c Release --no-restore
      - run: dotnet test CivitasId.slnx -c Release --no-build
        env:
          CI: true   # ContinuousIntegrationBuild → deterministic

  # Separate from the gate so coverage instrumentation never slows the pass/fail signal.
  # Intentionally has no `needs: build-test` — it runs in parallel and (via if: always
  # on the upload) preserves coverage even when the gate is red, so coverage is a signal,
  # not a merge blocker. Each test project applies its own coverage.runsettings
  # automatically via the TestingPlatformCommandLineArguments embed in Directory.Build.props
  # — no per-project --coverage-settings path needed here.
  coverage:
    runs-on: ubuntu-latest
    # Run coverage only on pushes to protected branches (post-merge), not on every PR —
    # coverage is trend data, not a merge gate. On a PR, github.ref is refs/pull/N/merge.
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore CivitasId.slnx
      - run: dotnet build CivitasId.slnx -c Release --no-restore
      - run: dotnet test CivitasId.slnx -c Release --no-build --coverage --coverage-output-format cobertura
        env:
          CI: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-cobertura
          path: '**/TestResults/*.cobertura.xml'
          if-no-files-found: error
