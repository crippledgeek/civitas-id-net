name: AOT Smoke Test

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  aot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AotSmokeTest/AotSmokeTest.csproj

      - name: Publish AOT
        run: dotnet publish tests/AotSmokeTest -c Release -r ${{ matrix.rid }} /p:PublishAot=true

      - name: Run AOT binary
        shell: bash
        run: |
          ARTIFACT="tests/AotSmokeTest/bin/Release/net10.0/${{ matrix.rid }}/publish/AotSmokeTest"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ARTIFACT="${ARTIFACT}.exe"
          fi
          "$ARTIFACT"
